services:
  # ==========================================
  # Victoria Observability Stack (Logs, Metrics, Traces)
  # ==========================================
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    command:
      - "-storageDataPath=/var/lib/vlogs"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:9428"
    volumes:
      - ${VLOGS_DATA_PATH:-/var/lib/vlogs}:/var/lib/vlogs
    networks:
      - o11y-net

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/var/lib/vmetrics"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:8428"
    volumes:
      - ${VMETRICS_DATA_PATH:-/var/lib/vmetrics}:/var/lib/vmetrics
    networks:
      - o11y-net

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    container_name: victoriatraces
    restart: unless-stopped
    command:
      - "-storageDataPath=/var/lib/vtraces"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:10428"
      - "-otlpGRPCListenAddr=:4317"
      - "-otlpGRPC.tls=false"
    volumes:
      - ${VTRACES_DATA_PATH:-/var/lib/vtraces}:/var/lib/vtraces
    networks:
      - o11y-net

  # ==========================================
  # Grafana with MySQL Backend
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: grafana
      MYSQL_USER: grafana
      MYSQL_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u grafana -p$${GRAFANA_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DATABASE_TYPE: mysql
      GF_DATABASE_HOST: mysql:3306
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_SERVER_ROOT_URL: ${SERVER_PROTOCOL:-https}://${SERVER_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==========================================
  # LiteLLM Proxy with PostgreSQL Backend
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # Redis In-Memory Cache for LiteLLM
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme_redis}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis-data:/data
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD:-changeme_redis}\" redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "True"
      PROXY_BASE_URL: ${PROXY_BASE_URL:-${SERVER_PROTOCOL:-https}://${SERVER_HOST:-localhost}/litellm}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ==========================================
  # Mezmo AURA SRE AI Agent
  # ==========================================
  aura:
    image: mezmo/aura:latest
    container_name: aura
    restart: unless-stopped
    command:
      - ./aura
      - webserver
      - --verbose
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      CONFIG_PATH: "/app/config/config.toml"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AURA_MODEL: ${AURA_MODEL:-aura-sre-model}
      AURA_LLM_BASE_URL: "http://litellm:4000/v1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - ./aura/config.toml:/app/config/config.toml:ro
    depends_on:
      litellm:
        condition: service_healthy
      mcp-victoriametrics:
        condition: service_started
      mcp-victorialogs:
        condition: service_started
      mcp-victoriatraces:
        condition: service_started
      mcp-grafana:
        condition: service_started
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Model Context Protocol (MCP) Servers
  # ==========================================
  mcp-victoriametrics:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
    container_name: mcp-victoriametrics
    restart: unless-stopped
    environment:
      VM_INSTANCE_ENTRYPOINT: http://victoriametrics:8428
      VM_INSTANCE_TYPE: single
      MCP_SERVER_MODE: sse
      MCP_LISTEN_ADDR: :8080
    depends_on:
      - victoriametrics
    networks:
      - o11y-net

  mcp-victorialogs:
    image: ghcr.io/victoriametrics/mcp-victorialogs:latest
    container_name: mcp-victorialogs
    restart: unless-stopped
    environment:
      VL_INSTANCE_ENTRYPOINT: http://victorialogs:9428
      MCP_SERVER_MODE: sse
      MCP_LISTEN_ADDR: :8081
    depends_on:
      - victorialogs
    networks:
      - o11y-net

  mcp-victoriatraces:
    image: ghcr.io/victoriametrics-community/mcp-victoriatraces:latest
    container_name: mcp-victoriatraces
    restart: unless-stopped
    environment:
      VT_INSTANCE_ENTRYPOINT: http://victoriatraces:10428
      MCP_SERVER_MODE: sse
      MCP_LISTEN_ADDR: :8082
    depends_on:
      - victoriatraces
    networks:
      - o11y-net

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    restart: unless-stopped
    command: ["-t", "sse", "-address", "0.0.0.0:8000", "-allowed-hosts", "*"]
    environment:
      GRAFANA_URL: http://grafana:3000/grafana
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    depends_on:
      - grafana
    networks:
      - o11y-net

  # ==========================================
  # Host Metrics, Process Exporter & eBPF Tracing
  # ==========================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - o11y-net

  process-exporter:
    image: ncabatoff/process-exporter:latest
    container_name: process-exporter
    restart: unless-stopped
    pid: host
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter/process-exporter.yml:/config/process-exporter.yml:ro
    command:
      - "-procfs=/host/proc"
      - "-config.path=/config/process-exporter.yml"
    networks:
      - o11y-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/log:/var/log:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces
    networks:
      - o11y-net

  beyla:
    image: grafana/beyla:latest
    container_name: beyla
    restart: unless-stopped
    pid: host
    privileged: true
    init: true
    environment:
      BEYLA_SYSTEM_WIDE: "true"
      BEYLA_OPEN_PORT: "1-65535"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      - otel-collector
    networks:
      - o11y-net

  # ==========================================
  # Vector Log Collector (Docker Logs -> VictoriaLogs)
  # ==========================================
  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
    depends_on:
      - victorialogs
      - victoriametrics
    networks:
      - o11y-net

  # ==========================================
  # Nginx Reverse Proxy with SSL & Basic Auth
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces
      - grafana
      - litellm
      - aura
    networks:
      - o11y-net
  # ==========================================
  # DuckDNS Dynamic DNS Updater
  # ==========================================
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-neoson-o11y}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    networks:
      - o11y-net

volumes:
  mysql-data:
  grafana-data:
  postgres-data:
  redis-data:
  vector-data:

networks:
  o11y-net:
    driver: bridge

