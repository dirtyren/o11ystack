# ==========================================
# Langfuse v4 (self-hosted) — shared environment
# Web + Worker share DB/CH/S3/Redis settings. Secrets come from .env.
# ==========================================
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD:-changeme_redis}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  # ==========================================
  # Victoria Observability Stack (Logs, Metrics, Traces)
  # ==========================================
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    restart: unless-stopped
    command:
      - "-storageDataPath=/var/lib/vlogs"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:9428"
    volumes:
      - ${VLOGS_DATA_PATH:-/var/lib/vlogs}:/var/lib/vlogs
    networks:
      - o11y-net

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/var/lib/vmetrics"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:8428"
    volumes:
      - ${VMETRICS_DATA_PATH:-/var/lib/vmetrics}:/var/lib/vmetrics
    networks:
      - o11y-net

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.11.0
    container_name: victoriatraces
    restart: unless-stopped
    command:
      - "-storageDataPath=/var/lib/vtraces"
      - "-retentionPeriod=1y"
      - "-httpListenAddr=:10428"
      - "-otlpGRPCListenAddr=:4317"
      - "-otlpGRPC.tls=false"
    volumes:
      - ${VTRACES_DATA_PATH:-/var/lib/vtraces}:/var/lib/vtraces
    networks:
      - o11y-net

  # ==========================================
  # Grafana with MySQL Backend
  # ==========================================
  mysql:
    image: mysql:8.0.46
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: grafana
      MYSQL_USER: grafana
      MYSQL_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u grafana -p$${GRAFANA_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DATABASE_TYPE: mysql
      GF_DATABASE_HOST: mysql:3306
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_SERVER_ROOT_URL: ${SERVER_PROTOCOL:-https}://${SERVER_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource,grafana-clickhouse-datasource"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "mezmo-aura-app,opensre-app"
      GF_DATAPROXY_TIMEOUT: "900"
      GRAFANA_LANGFUSE_DB_PASSWORD: ${GRAFANA_LANGFUSE_DB_PASSWORD}
      GRAFANA_LANGFUSE_DB_USER: ${GRAFANA_LANGFUSE_DB_USER:-grafana_langfuse}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/plugins/mezmo-aura-app/dist:/var/lib/grafana/plugins/mezmo-aura-app:ro
      - ./grafana/plugins/opensre-app/dist:/var/lib/grafana/plugins/opensre-app:ro
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==========================================
  # LiteLLM Proxy with PostgreSQL Backend
  # ==========================================
  postgres:
    image: postgres:16.15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # Redis In-Memory Cache for LiteLLM
  # ==========================================
  redis:
    image: redis:7.4.11-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme_redis}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis-data:/data
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD:-changeme_redis}\" redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm:v1.100.1
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "True"
      PROXY_BASE_URL: ${PROXY_BASE_URL:-${SERVER_PROTOCOL:-https}://${SERVER_HOST:-localhost}/litellm}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-}
      # --- OpenTelemetry traces (LLM + MCP tool calls) -> otel-collector -> VictoriaTraces + Langfuse ---
      LITELLM_OTEL_V2: "true"
      OTEL_EXPORTER: "otlp_grpc"
      OTEL_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "litellm"
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "span_only"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ==========================================
  # Mezmo AURA SRE AI Agent
  # ==========================================
  aura:
    image: mezmo/aura:0.2.17
    container_name: aura
    restart: unless-stopped
    command:
      - ./aura
      - webserver
      - --verbose
      - --enable-a2a
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      CONFIG_PATH: "/app/config/config.toml"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AURA_MODEL: ${AURA_MODEL:-aura-sre-model}
      AURA_LLM_BASE_URL: "http://litellm:4000/v1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - ./aura/config.toml:/app/config/config.toml:ro
    depends_on:
      litellm:
        condition: service_healthy
      mcp-victoriametrics:
        condition: service_started
      mcp-victorialogs:
        condition: service_started
      mcp-victoriatraces:
        condition: service_started
      mcp-grafana:
        condition: service_started
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # OpenSRE AI Agent (Tracer-Cloud)
  # ==========================================
  opensre:
    build:
      context: ./opensre
      dockerfile: Dockerfile
    container_name: opensre
    restart: unless-stopped
    environment:
      PORT: "8000"
      MODE: "web"
      LLM_PROVIDER: "custom-openai"
      CUSTOM_OPENAI_BASE_URL: "http://litellm:4000/v1"
      CUSTOM_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      CUSTOM_OPENAI_MODEL: ${AURA_MODEL:-aura-sre-model}
      VICTORIA_LOGS_URL: "http://victorialogs:9428"
      PROMETHEUS_URL: "http://victoriametrics:8428"
      GRAFANA_INSTANCE_URL: "http://grafana:3000/grafana"
      GRAFANA_READ_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
      HEADROOM_MCP_URL: "http://litellm:4000/headroom/mcp"
      HEADROOM_MCP_AUTH_TOKEN: ${LITELLM_MASTER_KEY}
    depends_on:
      litellm:
        condition: service_healthy
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      grafana:
        condition: service_started
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Headroom Context Compression (Proxy + MCP)
  # ==========================================
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom
    restart: unless-stopped
    entrypoint: ["headroom", "proxy"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8787"
    environment:
      HEADROOM_BEACON: "off"
      DO_NOT_TRACK: "1"
      HEADROOM_SAVINGS_EVENTS_PATH: "/headroom-state/savings_events.jsonl"
    volumes:
      - headroom-state:/headroom-state
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  headroom-mcp:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom-mcp
    restart: unless-stopped
    entrypoint: ["headroom", "mcp", "serve"]
    command:
      - "--transport"
      - "http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8788"
      - "--path"
      - "/mcp"
      - "--proxy-url"
      - "http://headroom:8787"
    environment:
      HEADROOM_BEACON: "off"
      DO_NOT_TRACK: "1"
      HEADROOM_SAVINGS_EVENTS_PATH: "/headroom-state/savings_events.jsonl"
    volumes:
      - headroom-state:/headroom-state
    depends_on:
      headroom:
        condition: service_started
    networks:
      - o11y-net
    healthcheck:
      disable: true

  # ==========================================
  # Headroom savings-ledger exporter
  # (MCP + proxy compression events → Prometheus)
  # ==========================================
  headroom-exporter:
    image: python:3.12-slim
    container_name: headroom-exporter
    restart: unless-stopped
    command: ["python", "/app/exporter.py"]
    environment:
      HEADROOM_LEDGER_PATH: "/headroom-state/savings_events.jsonl"
      EXPORTER_PORT: "9107"
    volumes:
      - ./headroom-exporter/exporter.py:/app/exporter.py:ro
      - headroom-state:/headroom-state:ro
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9107/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # Langfuse v4 — self-hosted LLM observability
  # (web UI behind nginx at /langfuse, OTLP ingest for LiteLLM traces)
  # ==========================================
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      GRAFANA_LANGFUSE_DB_USER: ${GRAFANA_LANGFUSE_DB_USER:-grafana_langfuse}
      GRAFANA_LANGFUSE_DB_PASSWORD: ${GRAFANA_LANGFUSE_DB_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      - ./langfuse/clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  langfuse-minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: langfuse-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: langfuse
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_BROWSER: "off"
    volumes:
      - langfuse-minio-data:/bitnami/minio/data
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-web:
    # Built from source: NEXT_PUBLIC_BASE_PATH=/langfuse (see scripts/build-langfuse-web.sh)
    image: o11ystack/langfuse-web:4-langfuse-path
    container_name: langfuse-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${SERVER_PROTOCOL:-https}://${SERVER_HOST:-localhost}/langfuse/api/auth
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-o11ystack}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-o11ystack}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-o11ystack}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-o11ystack}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@o11ystack.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LITELLM_MASTER_KEY}
      # Next.js standalone binds to $HOSTNAME, which Docker sets to the container
      # ID -> the app would only listen on the container IP and every in-container
      # healthcheck on 127.0.0.1 fails. Bind all interfaces instead.
      HOSTNAME: "0.0.0.0"
    networks:
      - o11y-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/langfuse/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    networks:
      - o11y-net

  # ==========================================
  # Model Context Protocol (MCP) Servers
  # ==========================================
  mcp-victoriametrics:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2
    container_name: mcp-victoriametrics
    restart: unless-stopped
    environment:
      VM_INSTANCE_ENTRYPOINT: http://victoriametrics:8428
      VM_INSTANCE_TYPE: single
      MCP_SERVER_MODE: sse
      MCP_LISTEN_ADDR: :8080
    depends_on:
      - victoriametrics
    networks:
      - o11y-net

  mcp-victorialogs:
    image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
    container_name: mcp-victorialogs
    restart: unless-stopped
    environment:
      VL_INSTANCE_ENTRYPOINT: http://victorialogs:9428
      MCP_SERVER_MODE: sse
      MCP_LISTEN_ADDR: :8081
    depends_on:
      - victorialogs
    networks:
      - o11y-net

  mcp-victoriatraces:
    image: ghcr.io/victoriametrics-community/mcp-victoriatraces:v1.5.0
    container_name: mcp-victoriatraces
    restart: unless-stopped
    environment:
      VT_INSTANCE_ENTRYPOINT: http://victoriatraces:10428
      MCP_SERVER_MODE: sse
      MCP_LISTEN_ADDR: :8082
    depends_on:
      - victoriatraces
    networks:
      - o11y-net

  mcp-grafana:
    image: grafana/mcp-grafana:1.4.1
    container_name: mcp-grafana
    restart: unless-stopped
    command: ["-t", "sse", "-address", "0.0.0.0:8000", "-allowed-hosts", "*"]
    environment:
      GRAFANA_URL: http://grafana:3000/grafana
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    depends_on:
      - grafana
    networks:
      - o11y-net

  # ==========================================
  # Host Metrics, Process Exporter & eBPF Tracing
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - o11y-net

  process-exporter:
    image: ncabatoff/process-exporter:v0.8.7
    container_name: process-exporter
    restart: unless-stopped
    pid: host
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter/process-exporter.yml:/config/process-exporter.yml:ro
    command:
      - "-procfs=/host/proc"
      - "-config.path=/config/process-exporter.yml"
    networks:
      - o11y-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    devices:
      - /dev/kmsg
    networks:
      - o11y-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: otel-collector
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/log:/var/log:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGFUSE_OTLP_AUTH_HEADER: ${LANGFUSE_OTLP_AUTH_HEADER}
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces
    networks:
      - o11y-net

  beyla:
    image: grafana/beyla:3.35.0
    container_name: beyla
    restart: unless-stopped
    pid: host
    privileged: true
    init: true
    environment:
      BEYLA_SYSTEM_WIDE: "true"
      BEYLA_OPEN_PORT: "1-65535"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      - otel-collector
    networks:
      - o11y-net

  # ==========================================
  # Vector Log Collector (Docker Logs -> VictoriaLogs)
  # ==========================================
  vector:
    image: timberio/vector:0.58.0-alpine
    container_name: vector
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
    depends_on:
      - victorialogs
      - victoriametrics
    networks:
      - o11y-net

  # ==========================================
  # Nginx Reverse Proxy with SSL & Basic Auth
  # ==========================================
  nginx:
    image: nginx:1.31.5-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces
      - grafana
      - litellm
      - aura
      - opensre
      - headroom
      - langfuse-web
    networks:
      - o11y-net
  # ==========================================
  # DuckDNS Dynamic DNS Updater
  # ==========================================
  duckdns:
    image: lscr.io/linuxserver/duckdns:version-73f1bc7d
    container_name: duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-neoson-o11y}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    networks:
      - o11y-net

volumes:
  headroom-state:
  mysql-data:
  grafana-data:
  postgres-data:
  redis-data:
  vector-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:

networks:
  o11y-net:
    driver: bridge

