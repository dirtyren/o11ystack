general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  use_x_forwarded_for: true

# MCP Servers accessible to LiteLLM and connected agents
mcp_servers:
  victoriametrics:
    url: "http://mcp-victoriametrics:8080/sse"
    transport: "sse"
    description: "VictoriaMetrics MCP Server for metrics querying, time series analysis, and alerting rules"
  victorialogs:
    url: "http://mcp-victorialogs:8081/sse"
    transport: "sse"
    description: "VictoriaLogs MCP Server for logs querying, log stream filtering, and log analytics"
  victoriatraces:
    url: "http://mcp-victoriatraces:8082/sse"
    transport: "sse"
    description: "VictoriaTraces MCP Server for tracing operations, service dependency graphs, and span inspection"
  grafana:
    url: "http://mcp-grafana:8000/sse"
    transport: "sse"
    description: "Grafana MCP Server with full Admin permissions for dashboards, data sources, alerts, and panel queries"

# Provisioned Free and Open Models
model_list:
  # Primary SRE model alias consumed by AURA
  - model_name: "aura-sre-model"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # Free Tier Cloud Providers
  - model_name: "openrouter-llama-3.3-70b-free"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter-deepseek-r1-free"
    litellm_params:
      model: "openrouter/deepseek/deepseek-r1:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter-gemini-flash-free"
    litellm_params:
      model: "openrouter/google/gemini-2.0-flash-exp:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter-qwen-coder-free"
    litellm_params:
      model: "openrouter/qwen/qwen-2.5-coder-32b-instruct:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # Google Gemini Free Tier (15 RPM / 1M TPM free)
  - model_name: "gemini-2.0-flash"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "os.environ/GEMINI_API_KEY"

  # Groq Free Tier (Ultra-fast inference)
  - model_name: "groq-llama-3.3-70b"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "os.environ/GROQ_API_KEY"

  # Local Free Ollama (Offline, 100% free CPU/GPU)
  - model_name: "ollama-llama3"
    litellm_params:
      model: "ollama/llama3.2"
      api_base: "os.environ/OLLAMA_API_BASE"

  # Commercial Cloud Providers (Optional - activated if API keys are set in .env)
  - model_name: "gpt-4o"
    litellm_params:
      model: "gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "gpt-4o-mini"
    litellm_params:
      model: "gpt-4o-mini"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "claude-3-5-sonnet"
    litellm_params:
      model: "anthropic/claude-3-5-sonnet-20241022"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  # Mock model for zero-API-key testing and offline validation
  - model_name: "mock-model"
    litellm_params:
      model: "gpt-3.5-turbo"
      mock_response: "AURA SRE Agent analysis: Metrics, logs, and traces indicate the system is operational."

