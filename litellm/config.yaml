general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  use_x_forwarded_for: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "7d"  # Keep logs for 7 days

  # Optional: set how frequently cleanup should run - default is daily
  maximum_spend_logs_retention_interval: "1d"  # Run cleanup daily

  # Optional: set exact time for cleanup (Cron syntax)
  maximum_spend_logs_cleanup_cron: "0 4 * * *" # Run at 04:00 AM daily

  # Optional: bound how much work a single run may do
  maximum_spend_logs_cleanup_batch_size: 1000   # Rows per DELETE statement
  maximum_spend_logs_cleanup_max_batches: 500   # DELETE statements per table per run
  maximum_spend_logs_cleanup_run_budget: "5m"   # Wall clock for the whole run
  maximum_spend_logs_cleanup_batch_timeout: "30s" # statement_timeout and lock_timeout per batch

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    password: os.environ/REDIS_PASSWORD
  drop_params: true
  max_tokens: 8192

# MCP Servers accessible to LiteLLM and connected agents
mcp_servers:
  victoriametrics:
    url: "http://mcp-victoriametrics:8080/sse"
    transport: "sse"
    description: "VictoriaMetrics MCP Server for metrics querying, time series analysis, and alerting rules"
  victorialogs:
    url: "http://mcp-victorialogs:8081/sse"
    transport: "sse"
    description: "VictoriaLogs MCP Server for logs querying, log stream filtering, and log analytics"
  victoriatraces:
    url: "http://mcp-victoriatraces:8082/sse"
    transport: "sse"
    description: "VictoriaTraces MCP Server for tracing operations, service dependency graphs, and span inspection"
  grafana:
    url: "http://mcp-grafana:8000/sse"
    transport: "sse"
    description: "Grafana MCP Server with full Admin permissions for dashboards, data sources, alerts, and panel queries"

# Provisioned Free and Open Models
model_list:
  # Primary SRE model alias consumed by AURA (mapped to active OpenRouter free model)
  - model_name: "aura-sre-model"
    litellm_params:
      model: "openrouter/nvidia/nemotron-3.5-lightning:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # Free Tier Cloud Providers
  - model_name: "openrouter-nemotron-free"
    litellm_params:
      model: "openrouter/nvidia/nemotron-3.5-lightning:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter-gemma-free"
    litellm_params:
      model: "openrouter/google/gemma-4-31b-it:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: "openrouter-deepseek-r1-free"
    litellm_params:
      model: "openrouter/deepseek/deepseek-r1:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # Google Gemini Free Tier (15 RPM / 1M TPM free)
  - model_name: "gemini-3.8-flash"
    litellm_params:
      model: "gemini/gemini-3.8-flash"
      api_key: "os.environ/GEMINI_API_KEY"
      max_input_tokens: 950000

  - model_name: "gemini-2.0-flash"
    litellm_params:
      model: "gemini/gemini-3.8-flash"
      api_key: "os.environ/GEMINI_API_KEY"
      max_input_tokens: 950000

  # Groq Free Tier (Ultra-fast inference)
  - model_name: "groq-llama-3.3-70b"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "os.environ/GROQ_API_KEY"

  # Local Free Ollama (Offline, 100% free CPU/GPU)
  - model_name: "ollama-llama3"
    litellm_params:
      model: "ollama/llama3.2"
      api_base: "os.environ/OLLAMA_API_BASE"

  # Commercial Cloud Providers (Optional - activated if API keys are set in .env)
  - model_name: "gpt-4o"
    litellm_params:
      model: "gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "gpt-4o-mini"
    litellm_params:
      model: "gpt-4o-mini"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "claude-3-5-sonnet"
    litellm_params:
      model: "anthropic/claude-3-5-sonnet-20241022"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  # Mock model for zero-API-key testing and offline validation
  - model_name: "mock-model"
    litellm_params:
      model: "gpt-3.5-turbo"
      mock_response: "AURA SRE Agent analysis: Metrics, logs, and traces indicate the system is operational."

