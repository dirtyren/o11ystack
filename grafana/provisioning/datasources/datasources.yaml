apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.50.0

  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    access: proxy
    url: http://victorialogs:9428
    editable: true

  - name: VictoriaTraces
    type: tempo
    uid: victoriatraces
    access: proxy
    url: http://victoriatraces:10428/select/tempo
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: 'victorialogs'
        filterByTraceID: true

  - name: VictoriaTraces-Jaeger
    type: jaeger
    uid: victoriatraces-jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger
    editable: true

  # Langfuse LLM observability data (ClickHouse OLAP store behind Langfuse v4).
  # Read-only user `grafana_langfuse`, created at ClickHouse first boot.
  - name: Langfuse-ClickHouse
    type: grafana-clickhouse-datasource
    uid: langfuse-clickhouse
    access: proxy
    editable: true
    jsonData:
      host: langfuse-clickhouse
      port: 8123
      protocol: http
      username: $GRAFANA_LANGFUSE_DB_USER
      defaultDatabase: default
      tlsSkipVerify: false
    secureJsonData:
      password: $GRAFANA_LANGFUSE_DB_PASSWORD
