apiVersion: 1

providers:
  - name: 'Observability Dashboards'
    orgId: 1
    folder: 'Observability'
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/definitions
      foldersFromFilesStructure: false
