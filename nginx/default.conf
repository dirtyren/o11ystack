# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker DNS resolver for dynamic backend resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Landing page for root
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Observability & AI Stack</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 8px; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; transition: transform 0.2s, border-color 0.2s; text-decoration: none; color: inherit; }
    .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
    .card h2 { margin-top: 0; font-size: 1.25rem; color: #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
    .card p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin-bottom: 12px; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 9999px; background: #334155; color: #38bdf8; }
    .badge.auth { background: #451a03; color: #fb923c; }
    .footer { margin-top: 48px; text-align: center; color: #64748b; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Observability & AI Stack</h1>
    <p class="subtitle">Unified metrics, logs, traces, dashboards, and LLM orchestration with Model Context Protocol (MCP)</p>
    <div class="grid">
      <a class="card" href="/grafana/">
        <h2>Grafana <span class="badge">App</span></h2>
        <p>Unified dashboards with MySQL backend and pre-provisioned VictoriaMetrics, VictoriaLogs, and VictoriaTraces.</p>
      </a>
      <a class="card" href="/vmetrics/vmui/">
        <h2>VictoriaMetrics <span class="badge auth">Basic Auth</span></h2>
        <p>High-performance metrics TSDB (1 year retention). Native VMUI query interface and Prometheus APIs.</p>
      </a>
      <a class="card" href="/vlogs/select/vmui/">
        <h2>VictoriaLogs <span class="badge auth">Basic Auth</span></h2>
        <p>Fast log database (1 year retention). LogSQL web explorer with server log ingestion via OpenTelemetry Collector.</p>
      </a>
      <a class="card" href="/vtraces/select/vmui/">
        <h2>VictoriaTraces <span class="badge auth">Basic Auth</span></h2>
        <p>High-capacity distributed trace storage (1 year retention). eBPF kernel tracing via Beyla and Jaeger/Tempo APIs.</p>
      </a>
      <a class="card" href="/litellm/ui/">
        <h2>LiteLLM Proxy <span class="badge">AI / MCP</span></h2>
        <p>Admin Dashboard (/litellm/ui/) and OpenAI-compatible Proxy (/litellm/) with MCP servers for VictoriaMetrics, VictoriaLogs, VictoriaTraces, and Grafana.</p>
      </a>
      <a class="card" href="/aura/">
        <h2>Mezmo AURA <span class="badge">SRE AI Agent</span></h2>
        <p>Autonomous SRE orchestrator with specialized workers, querying VictoriaMetrics, Logs, Traces & Grafana via MCP.</p>
      </a>
    </div>
    <div class="footer">Observability Stack powered by VictoriaMetrics, Grafana, OpenTelemetry, Beyla, LiteLLM, Mezmo AURA & Nginx</div>
  </div>
</body>
</html>';
    }

    # VictoriaLogs reverse proxy (with Basic Auth)
    location = /vlogs {
        return 301 /vlogs/;
    }
    location /vlogs/ {
        auth_basic "VictoriaLogs Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://victorialogs:9428/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VictoriaMetrics reverse proxy (with Basic Auth)
    location = /vmetrics {
        return 301 /vmetrics/;
    }
    location /vmetrics/ {
        auth_basic "VictoriaMetrics Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://victoriametrics:8428/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VictoriaTraces reverse proxy (with Basic Auth)
    location = /vtraces {
        return 301 /vtraces/;
    }
    location /vtraces/ {
        auth_basic "VictoriaTraces Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://victoriatraces:10428/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana reverse proxy (handles its own authentication)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Grafana live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LiteLLM Admin Dashboard UI
    location = /litellm/ui {
        return 301 /litellm/ui/$is_args$args;
    }
    location /litellm/ui/ {
        proxy_pass http://litellm:4000/ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / /;
        proxy_redirect http://litellm:4000/ui/ /litellm/ui/;
        proxy_redirect http://$host/ui/ /litellm/ui/;
        proxy_redirect /ui/ /litellm/ui/;
        proxy_redirect http:// $scheme://;
    }

    # Redirect root /ui to canonical /litellm/ui/
    location = /ui {
        return 301 /litellm/ui/$is_args$args;
    }
    location /ui/ {
        rewrite ^/ui/(.*)$ /litellm/ui/$1 permanent;
    }

    # LiteLLM Next.js UI static assets
    location /litellm-asset-prefix/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LiteLLM UI discovery endpoint & favicon
    location = /.well-known/litellm-ui-config {
        proxy_pass http://litellm:4000/.well-known/litellm-ui-config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /get_favicon {
        proxy_pass http://litellm:4000/get_favicon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        proxy_pass http://litellm:4000/ui/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiteLLM Swagger UI assets & OpenAPI spec
    location /swagger/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://litellm:4000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lazy/warm/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct LiteLLM auth fallback routes
    location ~ ^/(v[1-3]/login|login|sso/) {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiteLLM reverse proxy (API & Swagger UI)
    location = /litellm {
        return 301 /litellm/;
    }
    location /litellm/ {
        rewrite ^/litellm/(.*)$ /$1 break;
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_redirect http:// $scheme://;
    }

    # Mezmo AURA reverse proxy
    location = /aura {
        return 301 /aura/;
    }
    location /aura/ {
        rewrite ^/aura/(.*)$ /$1 break;
        proxy_pass http://aura:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
    }
}
