# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker DNS resolver for dynamic backend resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Landing page for root (public, no basic auth)
    location = / {
        root /usr/share/nginx/html;
        index landing.html index.html;
        auth_basic off;
    }

    location = /landing.html {
        root /usr/share/nginx/html;
        auth_basic off;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        auth_basic off;
    }

    # VictoriaLogs reverse proxy (with Basic Auth)
    location = /vlogs {
        return 301 /vlogs/;
    }
    location /vlogs/ {
        auth_basic "VictoriaLogs Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://victorialogs:9428/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VictoriaMetrics reverse proxy (with Basic Auth)
    location = /vmetrics {
        return 301 /vmetrics/;
    }
    location /vmetrics/ {
        auth_basic "VictoriaMetrics Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://victoriametrics:8428/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VictoriaTraces reverse proxy (with Basic Auth)
    location = /vtraces {
        return 301 /vtraces/;
    }
    location /vtraces/ {
        auth_basic "VictoriaTraces Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://victoriatraces:10428/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana reverse proxy (handles its own authentication)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Grafana live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LiteLLM Admin Dashboard UI
    location = /litellm/ui {
        return 301 /litellm/ui/$is_args$args;
    }
    location /litellm/ui/ {
        proxy_pass http://litellm:4000/ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / /;
        proxy_redirect http://litellm:4000/ui/ /litellm/ui/;
        proxy_redirect http://$host/ui/ /litellm/ui/;
        proxy_redirect /ui/ /litellm/ui/;
        proxy_redirect http:// $scheme://;
    }

    # Redirect root /ui to canonical /litellm/ui/
    location = /ui {
        return 301 /litellm/ui/$is_args$args;
    }
    location /ui/ {
        rewrite ^/ui/(.*)$ /litellm/ui/$1 permanent;
    }

    # LiteLLM Next.js UI static assets
    location /litellm-asset-prefix/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LiteLLM UI discovery endpoint & favicon
    location = /.well-known/litellm-ui-config {
        proxy_pass http://litellm:4000/.well-known/litellm-ui-config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /get_favicon {
        proxy_pass http://litellm:4000/get_favicon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        proxy_pass http://litellm:4000/ui/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiteLLM Swagger UI assets & OpenAPI spec
    location /swagger/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://litellm:4000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lazy/warm/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct LiteLLM auth & API fallback routes
    location ~ ^/(v[1-3]/login|login|sso/|chat/|v1/|models) {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_redirect http:// $scheme://;
    }

    # LiteLLM reverse proxy (API & Swagger UI)
    location = /litellm {
        return 301 /litellm/;
    }
    location /litellm/ {
        rewrite ^/litellm/(.*)$ /$1 break;
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_redirect http:// $scheme://;
    }

    # Mezmo AURA reverse proxy (with Basic Auth)
    location = /aura {
        return 301 /aura/;
    }
    location /aura/ {
        auth_basic "Mezmo AURA Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        rewrite ^/aura/(.*)$ /$1 break;
        proxy_pass http://aura:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
    }
}
