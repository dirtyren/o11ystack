receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'node-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['node-exporter:9100']
        - job_name: 'process-exporter'
          scrape_interval: 15s
          static_configs:
            - targets: ['process-exporter:9256']
        - job_name: 'cadvisor'
          scrape_interval: 15s
          static_configs:
            - targets: ['cadvisor:8080']
        - job_name: 'victoriametrics'
          scrape_interval: 15s
          static_configs:
            - targets: ['victoriametrics:8428']
        - job_name: 'victorialogs'
          scrape_interval: 15s
          static_configs:
            - targets: ['victorialogs:9428']
        - job_name: 'victoriatraces'
          scrape_interval: 15s
          static_configs:
            - targets: ['victoriatraces:10428']


  filelog:
    include:
      - /var/log/**/*.log
      - /var/log/syslog
      - /var/log/messages
    start_at: beginning
    retry_on_failure:
      enabled: true
    operators:
      - type: regex_parser
        regex: '^(?P<time>[^ ]+ [^ ]+ [^ ]+) (?P<host>[^ ]+) (?P<service>[^\[:]+)(?:\[(?P<pid>\d+)\])?: (?P<message>.*)$'
        timestamp:
          parse_from: attributes.time
          layout: '%b %d %H:%M:%S'
        severity:
          parse_from: attributes.level
        if: 'body matches "^[A-Z][a-z]{2} "'

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [system, env]
    timeout: 2s

exporters:
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    tls:
      insecure: true

  otlphttp/logs:
    logs_endpoint: "http://victorialogs:9428/insert/opentelemetry/v1/logs"
    tls:
      insecure: true

  otlp/traces:
    endpoint: "victoriatraces:4317"
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/traces]
  telemetry:
    logs:
      level: info
